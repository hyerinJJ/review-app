<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>말로 쓰는 상품 리뷰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a single 393px phone column, centered on a tinted stage; each step is one screen. */
:root{
  --stage:#E9EBEF; --bg:#FFFFFF; --bg-soft:#F5F6F8; --seg:#F1F2F4; --card:#FFFFFF;
  --ink:#212429; --sub:#737880; --ph:#9EA3AB; --line:#E1E3E8; --line-strong:#CDD0D5;
  --blue:#346AFF; --blue-soft:#E3EBFD; --on-blue:#FFFFFF; --star:#FFCC33; --star-off:#DCDEE2;
  --disabled:#EBECEF; --disabled-ink:#9EA3AB; --toast:#212429; --toast-ink:#FFFFFF;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0E0F12; --bg:#17181C; --bg-soft:#202228; --seg:#24262C; --card:#1D1F24;
  --ink:#ECEEF1; --sub:#9AA0A8; --ph:#6E737B; --line:#30333A; --line-strong:#40444C;
  --blue:#5B86FF; --blue-soft:#24304D; --on-blue:#FFFFFF; --star:#FFCC33; --star-off:#3A3D44;
  --disabled:#2A2C32; --disabled-ink:#6E737B; --toast:#ECEEF1; --toast-ink:#17181C; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0E0F12; --bg:#17181C; --bg-soft:#202228; --seg:#24262C; --card:#1D1F24;
  --ink:#ECEEF1; --sub:#9AA0A8; --ph:#6E737B; --line:#30333A; --line-strong:#40444C;
  --blue:#5B86FF; --blue-soft:#24304D; --on-blue:#FFFFFF; --star:#FFCC33; --star-off:#3A3D44;
  --disabled:#2A2C32; --disabled-ink:#6E737B; --toast:#ECEEF1; --toast-ink:#17181C; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.phone{position:relative;width:100%;max-width:393px;height:100%;max-height:852px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:500px){body{align-items:center;padding-block:24px}.phone{border-radius:28px;box-shadow:0 10px 40px rgba(20,24,40,.12)}}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.hd{display:flex;align-items:center;gap:10px;padding:20px 16px 12px;background:var(--bg)}
.hd h1{font-size:20px;font-weight:500;margin:0;flex:1}
.hd .step,.hd .link{font-size:13px;font-weight:500;color:var(--sub)}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;margin-left:-4px}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:16px}
.bottom{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.cta{width:100%;padding:13px 0;border-radius:6px;font-size:15px;font-weight:700;background:var(--blue);color:var(--on-blue)}
.cta:disabled{background:var(--disabled);color:var(--disabled-ink);cursor:default}
/* rating */
#s-rate .body{background:var(--bg-soft);padding:12px 16px}
#s-rate{background:var(--bg-soft)}
.card{background:var(--card);border-radius:14px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.prod-img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.card h2{font-size:14px;font-weight:700;margin:0;text-align:center}
.card p.sub{font-size:12px;color:var(--sub);margin:-12px 0 0;text-align:center}
.stars{display:flex;gap:8px}
.star{width:40px;height:40px}
.star svg{width:100%;height:100%;fill:var(--star-off);transition:fill .15s}
.star.on svg{fill:var(--star)}
.divider{height:1px;background:var(--line);align-self:stretch}
.pills{display:flex;gap:8px;align-self:stretch}
.pill{flex:1;padding:10px 0;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.pill[aria-pressed="true"]{border:1.5px solid var(--blue);color:var(--blue);font-weight:700}
.pill svg{width:15px;height:15px;stroke:currentColor}
/* write */
.summary{display:flex;align-items:center;gap:12px;background:var(--bg-soft);border-radius:8px;padding:10px 12px}
.summary img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.summary .nm{font-size:12px;font-weight:500}
.summary .mine{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:3px}
.mini-stars{display:flex;gap:1px}.mini-stars svg{width:13px;height:13px;fill:var(--star-off)}.mini-stars svg.on{fill:var(--star)}
.attach{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;font-weight:500;width:100%}
.attach svg{width:16px;height:16px;stroke:var(--ink)}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs:empty{display:none}
.thumbs .t{position:relative;flex:none;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg-soft)}
.thumbs .t img,.thumbs .t video{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:18px}
.seg{display:flex;gap:4px;padding:4px;background:var(--seg);border-radius:12px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--sub)}
.seg button svg{width:14px;height:14px;stroke:currentColor}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button[aria-selected="true"] svg{stroke:var(--blue)}
.seg .badge{font-size:11px;font-weight:700;color:var(--blue)}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.box textarea,.box input.title{width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;line-height:1.6;padding:0}
.box textarea::placeholder{color:var(--ph)}
.box input.title{font-weight:700}
.box textarea:focus,.box input.title:focus{outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.topics{white-space:nowrap}
.topics .chips{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
.chip{white-space:nowrap;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--seg);font-size:12px;color:var(--sub);transition:color .2s}
.chip svg{width:12px;height:12px;stroke:var(--ph)}
.chip.done{color:var(--ink);font-weight:500}
.chip.done svg{stroke:var(--blue)}
.ai-line{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.ai-line .grow{flex:1}
.ai-line button{color:var(--blue);font-weight:700;font-size:12px}
.tone{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.tone button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--sub);background:var(--card)}
.tone button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);font-weight:700}
.tone button:disabled{opacity:.5}
.voice-card{background:var(--bg-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mini-q{display:flex;align-items:center;gap:6px}
.mini-q span{background:var(--card);padding:6px 10px;border-radius:3px 12px 12px 12px;font-size:12px}
.mini-a{align-self:flex-end;display:flex;align-items:center;gap:4px;background:var(--blue-soft);padding:6px 10px;border-radius:12px 3px 12px 12px;font-size:12px}
.mini-a svg{width:11px;height:11px;stroke:var(--blue)}
.start-voice{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0;border-radius:8px;background:var(--blue);color:var(--on-blue);font-size:14px;font-weight:700}
.start-voice svg{width:16px;height:16px;stroke:var(--on-blue)}
/* chat */
.topics{display:flex;align-items:center;gap:6px;padding:8px 16px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:100%}
.msg .av{flex:none;width:28px;height:28px}
.msg .bub{white-space:pre-line;padding:10px 14px;font-size:14px;line-height:1.45;max-width:270px;overflow-wrap:anywhere}
.msg.ai .bub{background:var(--seg);border-radius:4px 16px 16px 16px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--blue-soft);border-radius:16px 4px 16px 16px}
.msg.me .bub.live{opacity:.6}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding-left:36px}
.quick button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;background:var(--card)}
.choice{display:flex;flex-direction:column;gap:8px;padding-left:36px;max-width:300px}
.choice button{padding:11px 14px;border-radius:8px;font-size:14px;font-weight:600;text-align:left;border:1px solid var(--blue);color:var(--blue);background:var(--card)}
.choice button.pri{background:var(--blue);color:var(--on-blue)}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ph);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.voice-bar{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--sub);min-height:18px;text-align:center}
.status.on{color:var(--ink);font-weight:500}
.wave{display:none;gap:2px;align-items:center;height:16px}
.status.on .wave{display:flex}
.wave i{width:3px;border-radius:2px;background:var(--blue);animation:w 1s ease-in-out infinite}
.wave i:nth-child(1){height:6px}.wave i:nth-child(2){height:12px;animation-delay:.1s}.wave i:nth-child(3){height:16px;animation-delay:.2s}.wave i:nth-child(4){height:10px;animation-delay:.3s}.wave i:nth-child(5){height:6px;animation-delay:.4s}
@keyframes w{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.mic-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.kb{width:40px;height:40px;border-radius:50%;background:var(--seg);display:grid;place-items:center}
.kb svg{width:18px;height:18px;stroke:var(--sub)}
.mic{justify-self:center;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--bg-soft);border:1px solid var(--line);transition:background .2s}
.mic svg{width:30px;height:30px;stroke:var(--ink)}
.mic.on{background:var(--blue);border-color:transparent;box-shadow:0 0 0 8px color-mix(in srgb,var(--blue) 18%,transparent)}
.mic.on svg{stroke:var(--on-blue)}
.mic:disabled{opacity:.4;cursor:default}
.type-row{display:flex;gap:8px}
.type-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--bg-soft);color:var(--ink);font:inherit}
.type-row button{padding:0 14px;border-radius:999px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:13px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--toast);color:var(--toast-ink);border-radius:10px;padding:12px 16px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.done-wrap h2{margin:0;font-size:20px}
.done-wrap p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.done-review{align-self:stretch;text-align:left;background:var(--bg-soft);border-radius:10px;padding:14px;font-size:14px;line-height:1.6}
.note{font-size:12px;color:var(--sub);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <!-- 1. 평가 -->
  <section class="screen" id="s-rate">
    <header class="hd"><span class="icon-btn" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12 15 19.5"/></svg></span><h1>리뷰 작성하기</h1><span class="step">1/2</span></header>

ITEMS.chicken.guide='먹는 상황(언제, 뭐랑) → 먹어본 맛·식감 → 먹는 방법과 상황 → 다른 제품과 비교 → 아쉬운 점 → 재구매. 예: "보통 언제 먹어? 먹을 만했어?"';
ITEMS.light.guide='쓰는 상황(뭘 찍을 때) → 켜본 밝기·색감 → 폰/카메라에 다는 방법 → 쓰는 장소와 상황 → 불편한 점(무게·발열·배터리) → 재구매. 예: "주로 뭐 찍을 때 켜? 밝기는 쓸 만해?"';
ITEMS.chicken.story='이번에 시킨 닭가슴살, 먹어본 경험이 어땠는지 쭉 말로 서술해줄래?';
ITEMS.light.story='이번에 산 조명, 써본 경험이 어땠는지 쭉 말로 서술해줄래?';
const ITEM_KEY=(new URLSearchParams(location.search).get('item')||'chicken');
const ITEM=ITEMS[ITEM_KEY]||ITEMS.chicken;
const PRODUCT=ITEM.name;
const TOPICS=ITEM.topics;
const KW=ITEM.kw;
(()=>{const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('p-name',ITEM.title);set('p-name2',ITEM.option);set('p-rateq',ITEM.rateQ);set('p-sampleq',ITEM.sample[0]);set('p-samplea',ITEM.sample[1]);
  if(ITEM.img){for(const id of ['p-img','p-img2']){const e=document.getElementById(id);if(e)e.src=ITEM.img}const e=document.getElementById('p-img');if(e)e.alt=ITEM.title+' 상품 사진'}
  const ta=document.getElementById('r-body');if(ta)ta.placeholder=ITEM.placeholder;document.title=ITEM.title+' 리뷰 작성';})();
const NO_TOPICS=()=>({taste:false,usage:false,context:false,cons:false});
const st={rating:0,taste:null,seller:null,mode:'voice',turns:[],covered:NO_TOPICS(),aiBusy:false,result:null,files:[]};
const show=id=>{for(const s of document.querySelectorAll('.screen')) s.hidden=s.id!==id;};
function toast(t){$('toast-text').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200);}

/* ---------- 1. 평가 ---------- */
for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='star';b.innerHTML=STAR;b.setAttribute('role','radio');b.setAttribute('aria-label',i+'점');
  b.onclick=()=>{st.rating=i;renderRate();};$('stars').append(b);}
function pills(el,list,key,icons){list.forEach((l,i)=>{const b=document.createElement('button');b.className='pill';b.setAttribute('aria-pressed','false');
  b.innerHTML=(icons?`<span style="display:inline-flex;${i?'transform:rotate(180deg)':''}">${THUMB}</span>`:'')+l;
  b.onclick=()=>{st[key]=st[key]===l?null:l;renderRate();};el.append(b);});}
pills($('taste'),ITEM.rateOpts,'taste');
pills($('seller'),['좋아요','아쉬워요'],'seller',true);
function renderRate(){[...$('stars').children].forEach((b,i)=>{b.classList.toggle('on',i<st.rating);b.setAttribute('aria-checked',i+1===st.rating);});
  for(const [el,key] of [[$('taste'),'taste'],[$('seller'),'seller']]) for(const b of el.children) b.setAttribute('aria-pressed',b.textContent===st[key]);
  $('next').disabled=!st.rating;}
$('next').onclick=()=>{renderSummary();show('s-write');};
renderRate();

/* ---------- 2. 작성 ---------- */
function renderSummary(){$('mini-stars').innerHTML=Array.from({length:5},(_,i)=>STAR.replace('<svg',`<svg class="${i<st.rating?'on':''}"`)).join('');$('mini-taste').textContent=st.taste||'';}
$('back-rate').onclick=()=>show('s-rate');
function setMode(m){st.mode=m;$('tab-direct').setAttribute('aria-selected',m==='direct');$('tab-voice').setAttribute('aria-selected',m==='voice');$('pane-direct').hidden=m!=='direct';$('pane-voice').hidden=m!=='voice';updateSubmit();}
$('tab-direct').onclick=()=>setMode('direct');$('tab-voice').onclick=()=>setMode('voice');
$('attach').onclick=()=>$('file').click();
$('file').onchange=e=>{for(const f of e.target.files){if(st.files.length>=10)break;st.files.push(f);}e.target.value='';renderThumbs();};
function renderThumbs(){const el=$('thumbs');el.innerHTML='';st.files.forEach((f,i)=>{const d=document.createElement('div');d.className='t';const url=URL.createObjectURL(f);
  d.innerHTML=f.type.startsWith('video')?`<video src="${url}" muted></video>`:`<img src="${url}" alt="첨부 ${i+1}">`;const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','삭제');x.onclick=()=>{st.files.splice(i,1);renderThumbs();};d.append(x);el.append(d);});
  $('attach-label').textContent=st.files.length?`사진·동영상 ${st.files.length}/10`:'사진·동영상 첨부하기';}
function chipsHTML(c){return TOPICS.map(([k,l])=>`<span class="chip ${c[k]?'done':''}">${CHECK}${l}</span>`).join('');}
function detect(text){const c={};for(const [k] of TOPICS) c[k]=KW[k].test(text);return c;}
$('r-body').oninput=()=>{renderDirectChips();updateSubmit();};
function renderDirectChips(){$('chips-direct').innerHTML=chipsHTML(detect($('r-body').value));}
function updateSubmit(){$('submit').disabled=!(st.mode==='direct'&&$('r-body').value.trim().length>=10);}
renderDirectChips();
$('submit').onclick=()=>{const t=$('r-title').value.trim(),d=$('done-review');d.innerHTML='';
  if(t){const b=document.createElement('b');b.textContent=t;d.append(b,document.createElement('br'));}
  const p=document.createElement('div');p.style.whiteSpace='pre-line';p.textContent=$('r-body').value.trim();d.append(p);show('s-done');};
$('restart').onclick=()=>location.reload();
$('redo').onclick=e=>startChat(e,true);

/* ---------- 3. 대화 ---------- */
let buf='',partial='',silence=null,liveEl=null;
// 서버 함수(/api/ai)가 Claude API를 대신 불러요. 실패하면 미리 정해 둔 질문으로 이어가요.
async function api(task){const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({task,item:ITEM_KEY,rating:st.rating,taste:st.taste,turns:st.turns,tone:st.tone||'basic',persona:FRIEND_PERSONA,guide:ITEM.guide})});if(!r.ok)throw new Error('api '+r.status);return r.json();}
// 브라우저 내장 음성 인식(Chrome·Edge·Safari). 지원하지 않으면 null → 키보드 입력.
function makeSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,on=false,wantOn=false,endReason='';const h={p:[],f:[],s:[]};const emit=(k,e)=>h[k].forEach(fn=>fn(e));
  function create(){rec=new SR();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal){const t=r[0].transcript.trim();if(t)emit('f',{text:' '+t});}else interim+=r[0].transcript;}emit('p',{text:interim.trim()});};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){wantOn=false;endReason='not_granted';}
      else if(e.error==='audio-capture'){wantOn=false;endReason='upstream_error';}};
    rec.onend=()=>{if(wantOn){try{rec.start();return;}catch{}}on=false;emit('s',{state:'idle',reason:endReason||'stopped'});endReason='';};}
  return{start(){wantOn=true;if(on)return Promise.resolve();create();
      try{rec.start();on=true;emit('s',{state:'listening'});return Promise.resolve();}catch(e){on=false;return Promise.reject({code:'upstream_error'});}},
    stop(){wantOn=false;endReason='stopped';try{rec&&rec.stop();}catch{}return Promise.resolve();},
    active(){return on;},onPartial(fn){h.p.push(fn);},onFinal(fn){h.f.push(fn);},onState(fn){h.s.push(fn);}};}
const dict=makeSpeech();
(()=>{
  if(dict){dict.onPartial(({text})=>{partial=text;renderLive();armSilence();});
    dict.onFinal(({text})=>{buf=(buf?buf+text:text.trimStart());partial='';renderLive();armSilence();});
    dict.onState(({state,reason})=>{const on=state==='listening'||state==='starting';$('mic').classList.toggle('on',on);setStatus();
      if(state==='idle'&&reason&&!['stopped','viewer_stopped','hidden'].includes(reason)){micMsg=reason==='not_granted'?'마이크가 꺼져 있어요. 키보드로 답해주세요.':'음성 입력이 잠시 안 돼요. 키보드로 답해주세요.';setStatus();openKeyboard();}});}
})();
let micMsg='';
function listening(){return !!dict&&dict.active();}
function setStatus(){const s=$('status'),t=$('status-text');const on=listening();s.classList.toggle('on',on&&!st.aiBusy);
  t.textContent=st.aiBusy?'질문을 준비하고 있어요':on?'듣고 있어요':micMsg||(dict?'눌러서 말하기':'키보드로 답해주세요');}
function armSilence(){clearTimeout(silence);if(st.aiBusy)return;silence=setTimeout(()=>{if(!partial&&buf.trim()){window.ansSrc='voice';submitAnswer(buf.trim());}},1700);}
function renderLive(){if(st.aiBusy)return;const t=(buf+(partial?(buf?' ':'')+partial:'')).trim();
  if(!t){liveEl?.remove();liveEl=null;return;}
  if(!liveEl){liveEl=addMsg('me','');liveEl.querySelector('.bub').classList.add('live');}
  liveEl.querySelector('.bub').textContent=t;scrollChat();}
function addMsg(role,text){if(role==='ai'&&text)window.RLOG&&RLOG.ev('question',{v:text});const d=document.createElement('div');d.className='msg '+role;d.innerHTML=(role==='ai'?AV:'')+'<div class="bub"></div>';d.querySelector('.bub').textContent=text;$('chat').append(d);scrollChat();return d;}
function scrollChat(){const c=$('chat');c.scrollTop=c.scrollHeight;}
function quick(chips){return; /* 답변 예시는 보여주지 않음 */const q=document.createElement('div');q.className='quick';for(const c of chips){const b=document.createElement('button');b.textContent=c;b.onclick=()=>{q.remove();window.ansSrc='chip';submitAnswer(c);};q.append(b);}$('chat').append(q);scrollChat();}
function renderTopics(){$('chips-chat').innerHTML=chipsHTML(st.covered);const all=Object.values(st.covered).every(Boolean);const any=st.turns.some(t=>t.role==='user');
  $('finish').disabled=!any||st.aiBusy;$('finish').textContent=st.rebuyAnswered?'대화 마치고 리뷰 완성하기':'대화 중단하고 지금까지 내용 요약하기';}
function firstQuestion(){return[ITEM.story||'경험이 어땠는지 쭉 말로 서술해줄래?',[]];}
function startChat(e,again){
  // 마이크는 클릭 안에서 바로 켜야 해서 다른 작업보다 먼저 호출
  if(dict&&!dict.active()) dict.start({language:'ko'}).catch(err=>{if(err.code==='unavailable'||err.code==='not_granted'){micMsg='음성 입력을 쓸 수 없어요. 키보드로 답해주세요.';openKeyboard();setStatus();}});
  show('s-chat');
  if(!again&&st.turns.length) {renderTopics();setStatus();return;}
  $('chat').innerHTML='';st.turns=[];st.covered=NO_TOPICS();st.askedRebuy=false;st.rebuyAnswered=false;st.rebuyFollowed=false;st.askedTopics=new Set(['taste']);st.phase='story';st.firstContinue=false;buf='';partial='';liveEl=null;
  const [q,chips]=firstQuestion();st.turns.push({role:'assistant',content:q});addMsg('ai',q);quick(chips);renderTopics();setStatus();
  if(!dict) openKeyboard();}
$('start-voice').onclick=e=>startChat(e,false);
$('back-write').onclick=()=>{if(dict?.active())dict.stop();show('s-write');};
$('to-direct').onclick=()=>{if(dict?.active())dict.stop();setMode('direct');
  const said=st.turns.filter(t=>t.role==='user').map(t=>t.content.replace(/[.!?]?$/,'.')).join(' ');
  if(said&&!$('r-body').value.trim()){$('r-body').value=said;renderDirectChips();toast('지금까지 말한 내용을 가져왔어요. 이어서 글로 써보세요');}
  show('s-write');updateSubmit();};
$('mic').onclick=()=>{if(!dict){openKeyboard();return;}
  if(dict.active()){dict.stop();}else{micMsg='';dict.start({language:'ko'}).catch(err=>{if(err.code!=='stopped'){micMsg=err.code==='not_granted'?'마이크가 꺼져 있어요. 키보드로 답해주세요.':'음성 입력이 안 돼요. 키보드로 답해주세요.';setStatus();openKeyboard();}});}};
function openKeyboard(){$('type-row').hidden=false;}
$('kb').onclick=()=>{const r=$('type-row');r.hidden=!r.hidden;if(!r.hidden)$('type-in').focus();};
function sendTyped(){const v=$('type-in').value.trim();if(!v||st.aiBusy)return;$('type-in').value='';window.ansSrc='typed';submitAnswer(v);}
$('type-send').onclick=sendTyped;$('type-in').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)sendTyped();};

async function submitAnswer(text){
  if(st.aiBusy||!text)return;clearTimeout(silence);
  document.querySelectorAll('.quick').forEach(q=>q.remove());
  if(liveEl){liveEl.querySelector('.bub').classList.remove('live');liveEl.querySelector('.bub').textContent=text;liveEl=null;}else addMsg('me',text);
  buf='';partial='';
  st.turns.push({role:'user',content:text});
  window.RLOG&&RLOG.answer(text);
  // 재구매 질문에 방금 답했으면 대화는 여기서 끝
  // 재구매 답 이후에도 하고 싶은 말을 더 할 수 있어요. 더 한 말도 리뷰에 들어가요.
  if(st.askedRebuy){
    // 재구매 답에 이유가 없으면 한 번만 이유를 더 물어요
    if(!st.rebuyAnswered&&!st.rebuyFollowed&&!(text.length>=14||/서|때문|니까|해서|면/.test(text))){st.rebuyFollowed=true;
      const why='왜 그렇게 생각해?';st.turns.push({role:'assistant',content:why});addMsg('ai',why);
      quick(['맛이 계속 생각나서요','양에 비해 가격이 괜찮아서요','오래 먹으니 질려서요']);renderTopics();setStatus();return;}
    const first=!st.rebuyAnswered;st.rebuyAnswered=true;
    const reply=first?'좋아, 충분히 모였어! 더 하고 싶은 말 있으면 해주고, 없으면 아래 버튼 눌러서 리뷰로 정리하자.':'응, 그것도 담을게. 더 있으면 말해주고, 없으면 아래 버튼 눌러줘.';
    st.turns.push({role:'assistant',content:reply});addMsg('ai',reply);renderTopics();setStatus();return;}
  if(st.phase==='story'){return storySummary(text);}
  if(st.phase==='choose'){document.querySelectorAll('.choice').forEach(q=>q.remove());st.phase='chat';st.firstContinue=true;}
  return advance(text);
}
// 첫 서술이 끝나면 먼저 요약해 주고, 바로 작성할지 대화로 더 이어갈지 고르게 해요.
async function storySummary(text){
  st.aiBusy=true;renderTopics();setStatus();
  const typing=document.createElement('div');typing.className='msg ai';typing.innerHTML=AV+'<div class="bub typing"><i></i><i></i><i></i></div>';$('chat').append(typing);scrollChat();
  let r=null;try{r=await api('summary');}catch(e){r=null;}
  typing.remove();
  const said=st.turns.filter(t=>t.role==='user').map(t=>t.content).join(' ');
  const body=(r&&typeof r.body==='string'&&r.body.trim())?r.body.trim():said;
  const detected=detect(said);for(const k in detected) if(detected[k]) st.covered[k]=true;
  const msg='이렇게 정리해 봤어.\n\n'+body+'\n\n이대로 리뷰로 쓸까, 아니면 더 얘기해볼래?';
  st.turns.push({role:'assistant',content:msg});addMsg('ai',msg);
  st.phase='choose';st.aiBusy=false;renderTopics();setStatus();
  const c=document.createElement('div');c.className='choice';
  const mk=(label,pri,fn)=>{const b=document.createElement('button');b.textContent=label;if(pri)b.className='pri';b.onclick=()=>{c.remove();fn();};return b;};
  c.append(mk('대화로 더 이어가며 리뷰 쓰기',true,()=>{window.RLOG&&RLOG.ev('choice',{v:'continue'});addMsg('me','대화로 더 이어갈래');st.phase='chat';st.firstContinue=true;advance(said);}),
           mk('이 내용을 바로 요약해서 작성하기',false,()=>{window.RLOG&&RLOG.ev('choice',{v:'write_now'});addMsg('me','이대로 바로 작성할래');$('finish').onclick();}));
  $('chat').append(c);scrollChat();
}
async function advance(text){
  st.aiBusy=true;renderTopics();setStatus();
  const typing=document.createElement('div');typing.className='msg ai';typing.innerHTML=AV+'<div class="bub typing"><i></i><i></i><i></i></div>';$('chat').append(typing);scrollChat();
  let next=null;
  try{next=await api('next');}catch(e){next=null;}
  typing.remove();
  // AI가 답하지 못했을 때만 키워드로 칩을 채우고 정해 둔 질문으로 이어가요
  if(!next||typeof next.question!=='string'){if(st.pendingTopic)st.covered[st.pendingTopic]=true;const local=detect(text);for(const k in local) if(local[k]) st.covered[k]=true;next=localNext();}
  // 직접 물어본 항목만 체크해요. 지나가듯 말한 항목도 한 번은 따로 물어봐요.
  if(next.covered) for(const k of TOPICS.map(t=>t[0])) if(next.covered[k]&&st.askedTopics.has(k)) st.covered[k]=true;
  if(TOPIC_Q[next.topic]) st.askedTopics.add(next.topic);
  const answers=st.turns.filter(t=>t.role==='user').length;
  const unasked=TOPICS.map(t=>t[0]).find(k=>!st.askedTopics.has(k));
  const wantsEnd=/충분히 모였어요/.test(next.question)||next.topic==='done'||Object.values(st.covered).every(Boolean);
  if(wantsEnd&&unasked&&answers<9){next=localQuestion(unasked);}
  // 항목이 다 채워졌거나 AI가 끝내려 하면, 끝내기 전에 재구매 의사를 꼭 물어요
  else if(wantsEnd||answers>=9){
    st.askedRebuy=true;next={question:'마지막으로, 이거 다시 살 것 같아? 왜 그런지도 말해줘.',chips:['맛있어서 또 살 거예요','질려서 다른 걸로 바꿀래요','할인할 때 또 살게요']};}
  const q=next.question.trim();st.turns.push({role:'assistant',content:q});addMsg('ai',q);
  if(Array.isArray(next.chips)&&next.chips.length) quick(next.chips.slice(0,3).map(String));
  st.aiBusy=false;renderTopics();setStatus();
  if(buf||partial){renderLive();armSilence();}
}
// AI가 응답하지 못할 때 쓰는 정해 둔 질문. 물어본 항목은 답을 받으면 채운 것으로 봐요(같은 질문 반복 방지).
const TOPIC_Q={taste:[ITEM.q.taste,[]],usage:[ITEM.q.usage,[]],context:[ITEM.q.context,[]],cons:[ITEM.q.cons,[]]};
function localQuestion(k){st.pendingTopic=k;st.askedTopics.add(k);const [question,chips]=TOPIC_Q[k];return{question,chips,topic:k};}
function localNext(){st.pendingTopic=null;
  if(st.firstContinue){st.firstContinue=false;if(!st.covered.context){st.pendingTopic='context';st.askedTopics.add('context');return{question:ITEM.first[st.taste||'']||ITEM.first[''],chips:[],topic:'context'};}}const k=TOPICS.map(t=>t[0]).find(k=>!st.covered[k]);
  return k?localQuestion(k):{question:'충분히 모였어요! 더 하고 싶은 말이 있다면 해주시고, 없다면 대화를 마쳐주세요.',chips:[]};}

$('finish').onclick=async()=>{
  if(dict?.active()) dict.stop();
  const btn=$('finish');btn.disabled=true;btn.textContent='리뷰로 정리하고 있어요…';
  let r=null;
  try{r=await api('summary');}catch(e){r=null;}
  if(!r||typeof r.body!=='string'){const said=st.turns.filter(t=>t.role==='user').map(t=>t.content.replace(/[.!?]?$/,'.')).join(' ');r={title:'',body:said};}
  $('r-title').hidden=false;$('r-title').value=(r.title||'').slice(0,30);$('r-body').value=r.body.trim();
  $('ai-line').hidden=false;$('tone').hidden=false;setMode('direct');renderDirectChips();
  for(const k in st.covered) if(st.covered[k]) $('chips-direct').children[TOPICS.findIndex(t=>t[0]===k)].classList.add('done');
  show('s-write');updateSubmit();toast('대화 내용으로 리뷰를 완성했어요');window.RLOG&&RLOG.summary($('r-title').value,$('r-body').value,!!(r&&r.title!==undefined&&r.body&&st.turns.length));
  btn.textContent=st.rebuyAnswered?'대화 마치고 리뷰 완성하기':'대화 중단하고 지금까지 내용 요약하기';};
// 말투 바꾸기: 같은 대화로 리뷰를 다시 정리해요
for(const b of $('tone').querySelectorAll('button')) b.onclick=async()=>{
  if(b.getAttribute('aria-pressed')==='true')return;
  const btns=[...$('tone').querySelectorAll('button')];btns.forEach(x=>x.disabled=true);
  const prev=st.tone||'basic';st.tone=b.dataset.tone;btns.forEach(x=>x.setAttribute('aria-pressed',x===b));
  const before=$('r-body').value;$('r-body').value='말투를 바꾸고 있어요…';
  let r=null;try{r=await api('summary');}catch(e){r=null;}
  if(r&&typeof r.body==='string'){$('r-title').value=(r.title||'').slice(0,30);$('r-body').value=r.body.trim();window.RLOG&&RLOG.tone(st.tone,$('r-body').value);}
  else{$('r-body').value=before;st.tone=prev;btns.forEach(x=>x.setAttribute('aria-pressed',x.dataset.tone===prev));toast('말투를 바꾸지 못했어요. 잠시 후 다시 눌러주세요');}
  btns.forEach(x=>x.disabled=false);updateSubmit();};
</script>
<script>
/* ===== 연구 기록 (리뷰 작성 activity)
   실험 사이트와 같은 구글 시트에 저장한다. 참여자 번호는 주소의 ?pid= 로 받고, 없으면 처음에 입력창을 띄운다.
   직접 쓰기와 말로 쓰기를 각각 한 세션으로 기록한다. ===== */
(function(){
  const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxyfQUk-hnL_bw5A8YkMJ0WzpIEgVaC9BN5BHIvPckLGxJoOVtd8TAy8OJLpkH-zOi5/exec';
  const PRODUCT_NAME='리뷰 작성';
  const Q=new URLSearchParams(location.search);
  const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
  if(Q.get('gs'))LS.set('rw_gas',Q.get('gs'));
  const gas=()=>LS.get('rw_gas')||GAS_DEFAULT;
  let pid=Q.get('pid')||'';
  const T0=performance.now(),now=()=>Math.round((performance.now()-T0)/100)/10;
  const pre=[];               // 세션 시작 전 행동 (평가 화면 등)
  let S=null,buf=[],timer=0;  // 현재 세션
  function post(o,beacon){const b=JSON.stringify(o);
    if(beacon&&navigator.sendBeacon){try{if(navigator.sendBeacon(gas(),new Blob([b],{type:'text/plain;charset=utf-8'})))return Promise.resolve(true)}catch(e){}}
    return fetch(gas(),{method:'POST',mode:'no-cors',keepalive:b.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).then(()=>true,()=>false);}
  const base=(x=S)=>({sid:x.sid,pid,product:PRODUCT_NAME,condition:x.cond,slot:''});
  function flush(beacon,x=S){clearTimeout(timer);timer=0;if(!x||!buf.length)return Promise.resolve();const o=base(x);o.kind='events';o.events=buf.splice(0);return post(o,beacon);}
  function ev(type,d){const e=Object.assign({t:now(),type},d||{});if(!S){pre.push(e);return}buf.push(e);if(!timer)timer=setTimeout(flush,4000);}
  function begin(cond){
    if(S)return;
    const pa=String(pid).replace(/[^A-Za-z0-9]/g,'')||'P';
    S={sid:pa+'_write_'+(cond==='말로 쓰기'?'voice':'direct')+'_'+Date.now().toString(36),cond,start:now(),answers:[],src:{voice:0,typed:0,chip:0},
       tones:0,redo:0,toDirect:0,summary:'',summaryTitle:'',inputs:0,firstInput:null};
    const o=base();o.kind='start';o.session={started_at:new Date().toISOString(),ua:navigator.userAgent,screen:screen.width+'x'+screen.height,status:'진행 중'};
    post(o);buf=pre.splice(0);ev('session_start',{v:cond});
  }
  function summaryRow(title,body){
    const userChars=S.answers.reduce((a,x)=>a+x.text.replace(/\s/g,'').length,0);
    const fin=(body||'').trim(),sum=S.summary.trim();
    let edited='';
    if(sum){let i=0;while(i<sum.length&&i<fin.length&&sum[i]===fin[i])i++;let j=0;while(j<sum.length-i&&j<fin.length-i&&sum[sum.length-1-j]===fin[fin.length-1-j])j++;edited=Math.max(sum.length-i-j,fin.length-i-j);}
    return {item:typeof PRODUCT!=='undefined'?PRODUCT:'',rating:st.rating,taste:st.taste||'',seller:st.seller||'',
      write_time_s:Math.round((now()-S.start)*10)/10,
      participant_chars:S.cond==='말로 쓰기'?userChars:fin.replace(/\s/g,'').length,
      answers:S.answers.length,answers_voice:S.src.voice,answers_typed:S.src.typed,answers_example:S.src.chip,
      summary_chars:sum.replace(/\s/g,'').length||'',edited_chars_after_summary:edited,
      tone_changes:S.tones,redo_chat:S.redo,switched_to_direct:S.toDirect,
      topics_covered:Object.entries(st.covered||{}).filter(([,v])=>v).map(([k])=>k).join('|'),
      final_chars:fin.replace(/\s/g,'').length,photos:st.files.length,
      final_title:(title||'').trim(),final_body:fin};
  }
  window.RLOG={
    ev,
    answer(text){if(!S)begin('말로 쓰기');const src=window.ansSrc||'voice';window.ansSrc='voice';S.src[src]=(S.src[src]||0)+1;S.answers.push({t:now(),src,text});ev('answer',{v:text,src});},
    summary(title,body,ok){if(!S)return;S.summary=body||'';S.summaryTitle=title||'';ev('summary',{v:body,title,ai:ok?1:0});},
    tone(t,body){if(!S)return;S.tones++;S.summary=body||S.summary;ev('tone',{v:t});}
  };
  /* 화면 행동 */
  const on=(id,type,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(type,fn)};
  on('stars','click',()=>setTimeout(()=>ev('rating',{v:st.rating}),0));
  on('taste','click',()=>setTimeout(()=>ev('taste',{v:st.taste||''}),0));
  on('seller','click',()=>setTimeout(()=>ev('seller',{v:st.seller||''}),0));
  on('next','click',()=>ev('to_write'));
  on('tab-direct','click',()=>{ev('tab',{v:'직접 쓰기'});if(!S)begin('직접 쓰기');});
  on('tab-voice','click',()=>ev('tab',{v:'말로 쓰기'}));
  on('start-voice','click',()=>{begin('말로 쓰기');ev('chat_start');});
  on('redo','click',()=>{if(S){S.redo++;}ev('redo_chat');});
  on('to-direct','click',()=>{if(S)S.toDirect=1;ev('to_direct');});
  on('back-write','click',()=>ev('chat_back'));
  on('kb','click',()=>ev('keyboard_toggle'));
  on('mic','click',()=>ev('mic_toggle'));
  on('attach','click',()=>ev('attach'));
  let typing=0;
  on('r-body','input',()=>{if(!S)return;if(S.firstInput===null){S.firstInput=now();ev('first_input');}S.inputs++;clearTimeout(typing);typing=setTimeout(()=>ev('edit',{v:document.getElementById('r-body').value.replace(/\s/g,'').length}),1500);});
  on('r-body','paste',()=>ev('paste'));
  on('submit','click',()=>{if(!S)begin(st.mode==='voice'?'말로 쓰기':'직접 쓰기');
    const row=summaryRow(document.getElementById('r-title').value,document.getElementById('r-body').value);
    ev('submit',{v:row.final_chars});const cur=S;S=null;
    flush(false,cur).then(()=>{const o=base(cur);o.kind='session';o.status='완료';o.summary=row;
      o.extra={answers:cur.answers,turns:st.turns,ai_summary:cur.summary,ai_summary_title:cur.summaryTitle};return post(o);});});
  addEventListener('pagehide',()=>flush(true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true)});
  /* 참여자 번호 */
  if(pid)LS.set('rw_pid',pid);
  if(!pid){
    const last=LS.get('rw_pid')||'';
    const d=document.createElement('div');
    d.setAttribute('role','dialog');d.setAttribute('aria-label','참여자 번호 입력');
    d.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(17,24,39,.55);display:grid;place-items:center;padding:24px';
    d.innerHTML=`<form style="width:100%;max-width:320px;background:#fff;border-radius:16px;padding:20px;font:15px/1.5 inherit">
      <b style="font-size:17px">참여자 번호</b><p style="margin:4px 0 12px;color:#6b7280;font-size:13.5px">연구진이 입력합니다. 기록에 이 번호가 붙어요.</p>
      <input name="p" value="${last}" placeholder="예: A" autocomplete="off" style="width:100%;height:44px;padding:0 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box">
      <button style="margin-top:12px;width:100%;height:46px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:15px;font-weight:700">시작</button></form>`;
    d.querySelector('form').onsubmit=e=>{e.preventDefault();const v=d.querySelector('input').value.trim();if(!v)return;pid=v;LS.set('rw_pid',v);
      const u=new URL(location.href);u.searchParams.set('pid',v);history.replaceState(null,'',u);d.remove();};
    document.body.append(d);setTimeout(()=>d.querySelector('input').focus(),50);
  }
})();
</script>

</body>
